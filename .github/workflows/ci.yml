name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Offline test suite; NoCustomerIdentifiersTest is skipped (the identifier lists are private).
      - name: Build and test
        run: mvn -B -ntp clean verify

      # Offline tests of tools/inubit-cert-check.py; tests that need macOS binaries or keytool skip themselves.
      - name: Test operator tools
        run: python3 -I -m unittest discover -s tools/tests -v

  # Feature 013 (FR-013): the offline suite on Windows. The operator-tool tests stay on Linux.
  windows:
    runs-on: windows-latest
    # A normal run takes 35-40 minutes; a hang ends here with its log instead of running on.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Time-stamped Maven output plus a status line per minute (free memory, CPU, Java
      # processes); stops the build with its log when memory runs out, see the script.
      - name: Build and test
        shell: pwsh
        run: ./.github/scripts/windows-build.ps1 mvn -B -ntp clean verify
